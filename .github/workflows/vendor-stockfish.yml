name: Vendor Stockfish engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MateScope
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official Stockfish package
        run: npm pack stockfish@19.0.1 --pack-destination "$RUNNER_TEMP"

      - name: Copy browser engine into repository
        run: |
          mkdir -p "$RUNNER_TEMP/stockfish-package" engine
          tar -xzf "$RUNNER_TEMP/stockfish-19.0.1.tgz" -C "$RUNNER_TEMP/stockfish-package"
          cp "$RUNNER_TEMP/stockfish-package/package/bin/stockfish-19-lite-single.js" engine/
          cp "$RUNNER_TEMP/stockfish-package/package/bin/stockfish-19-lite-single.wasm" engine/
          if [ -f "$RUNNER_TEMP/stockfish-package/package/COPYING.txt" ]; then
            cp "$RUNNER_TEMP/stockfish-package/package/COPYING.txt" engine/STOCKFISH-COPYING.txt
          fi
          ls -lh engine/

      - name: Commit engine files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/
          if git diff --cached --quiet; then
            echo "Engine files are already up to date."
            exit 0
          fi
          git commit -m "Vendor Stockfish 19 lite single-threaded browser engine"
          git push origin HEAD:main
